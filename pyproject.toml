[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mockpulse"
version = "0.3.0"
description = "Zero-Dependency Local API Mocking & Chaos Fault Injection Engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "MockPulse Contributors" }
]
keywords = [
    "mock",
    "api-mocking",
    "chaos-engineering",
    "testing",
    "fault-injection",
    "latency-simulation",
    "microservices",
    "developer-tools"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RmznSd13/MockPulse"
Documentation = "https://github.com/RmznSd13/MockPulse#readme"
Repository = "https://github.com/RmznSd13/MockPulse.git"
Issues = "https://github.com/RmznSd13/MockPulse/issues"

[project.scripts]
mockpulse = "main:main"
